<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#131419"/>
  <!-- Top Panel -->
  <g transform="translate(40, 60)">
    <rect width="520" height="210" rx="16" fill="#1e1f26" stroke="#2d303e" stroke-width="3"/>
    <text x="30" y="45" fill="#fb7185" font-family="sans-serif" font-size="18" font-weight="bold">GUESSING USER CHURN:</text>
    <text x="30" y="95" fill="#a1a1aa" font-family="sans-serif" font-size="15">"Why did 80% of users leave on step 2?"</text>
    <text x="30" y="130" fill="#a1a1aa" font-family="sans-serif" font-size="15">"Maybe the button is the wrong shade of blue..."</text>
    <text x="30" y="170" fill="#f43f5e" font-family="sans-serif" font-size="16" font-weight="bold">❌ Spent 2 weeks changing CSS colors</text>
  </g>
  
  <line x1="40" y1="300" x2="560" y2="300" stroke="#2d303e" stroke-width="4" stroke-dasharray="10 10"/>
  
  <!-- Bottom Panel -->
  <g transform="translate(40, 330)">
    <rect width="520" height="210" rx="16" fill="#2a2306" stroke="#ffd200" stroke-width="3"/>
    <text x="30" y="45" fill="#fde047" font-family="sans-serif" font-size="18" font-weight="bold">POSTHOG SESSION REPLAY:</text>
    <text x="30" y="90" fill="#fef08a" font-family="sans-serif" font-size="15">▶️ Watching user click submit button...</text>
    <text x="30" y="125" fill="#fef08a" font-family="sans-serif" font-size="15">🚨 Uncaught TypeError: undefined is not a function</text>
    <text x="30" y="165" fill="#facc15" font-family="sans-serif" font-size="18" font-weight="bold">🦔 Fixed the exact JS error in 2 minutes!</text>
  </g>
</svg>
