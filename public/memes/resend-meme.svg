<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#09090b"/>
  <!-- Top Panel: Old html email -->
  <g transform="translate(40, 60)">
    <rect width="520" height="210" rx="16" fill="#18181b" stroke="#27272a" stroke-width="3"/>
    <text x="30" y="45" fill="#f43f5e" font-family="monospace" font-size="20" font-weight="bold">OLD WAY (2005):</text>
    <text x="30" y="85" fill="#a1a1aa" font-family="monospace" font-size="15">&lt;table border="0" cellpadding="0" cellspacing="0"&gt;</text>
    <text x="50" y="115" fill="#a1a1aa" font-family="monospace" font-size="15">&lt;tr&gt;&lt;td align="center" style="font-size:12px..."&gt;</text>
    <text x="70" y="145" fill="#e4e4e7" font-family="monospace" font-size="15">⚠️ Broken on Outlook 2007 &amp; Gmail Mobile</text>
    <text x="30" y="180" fill="#f43f5e" font-family="monospace" font-size="15">❌ Spent 14 hours fixing 1px table alignment</text>
  </g>
  
  <!-- Divider line -->
  <line x1="40" y1="300" x2="560" y2="300" stroke="#3f3f46" stroke-width="4" stroke-dasharray="10 10"/>
  
  <!-- Bottom Panel: Resend + React Email -->
  <g transform="translate(40, 330)">
    <rect width="520" height="210" rx="16" fill="#092e20" stroke="#10b981" stroke-width="3"/>
    <text x="30" y="45" fill="#34d399" font-family="sans-serif" font-size="20" font-weight="bold">RESEND + REACT EMAIL:</text>
    <text x="30" y="85" fill="#a7f3d0" font-family="monospace" font-size="15">import { Button } from "@react-email/components";</text>
    <text x="30" y="115" fill="#a7f3d0" font-family="monospace" font-size="15">await resend.emails.send({ to: "user@dev.com" });</text>
    <text x="30" y="160" fill="#6ee7b7" font-family="sans-serif" font-size="18" font-weight="bold">⚡ Delivered to Inbox in 250ms</text>
  </g>
</svg>
