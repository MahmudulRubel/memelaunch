[auth]
allowed_redirect_urls = [
  "https://www.launchme.me",
  "https://www.launchme.me/*",
  "https://launchme.me",
  "https://launchme.me/*",
  "http://localhost:3000",
  "http://localhost:3000/*"
]
require_email_verification = false
verify_email_method = "code"
reset_password_method = "code"
disable_signup = false

[auth.password]
min_length = 6
require_number = false
require_lowercase = false
require_uppercase = false
require_special_char = false

[auth.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
username = "resend"
sender_email = "onboarding@resend.dev"
sender_name = "MemeLaunch"
min_interval_seconds = 60
# Note: Set INSFORGE_SMTP_PASSWORD in your InsForge dashboard secrets
# to your RESEND_API_KEY value (re_xxxx...)
# When you verify a custom domain in Resend, update sender_email to your domain.

[storage]
max_file_size_mb = 50

[realtime]
retention_days = 0

[schedules]
retention_days = 7
